name: Build and Deploy to EKS 

on:
  push:
    branches:
      - main 

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPO: project-devops/flask-web
  IMAGE_TAG: ${{ github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Configure AWS credentials
      - name: Configure AWS credentials 
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secretes.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secret.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Login to ECR 
      - name: Login to Amazon ECR 
        uses: aws-actions/amazon-ecr-login@v2 
      
      # Build and push Docker image 
      - name: Build and push image 
        run: | 
          IMAGE_URI=${{ secret.AWS_ACCOUNT_ID }}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPO}:${IMAGE_TAG}
          docker build -t $IMAGE_URI .
          docker push $IMAGE_URI 
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV
