name: Build and Deploy to EKS 

on:
  push:
    branches:
      - main 

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  AWS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}
  ECR_REPO: project-devops/flask-web
  IMAGE_TAG: ${{ github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Configure AWS credentials
      - name: Configure AWS credentials 
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Login to ECR 
      - name: Login to Amazon ECR 
        uses: aws-actions/amazon-ecr-login@v2 
      
      # Build and push Docker image 
      - name: Build and push image 
        working-directory: flask-redis
        run: | 
          IMAGE_URI=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPO}:${IMAGE_TAG}
          docker build -t $IMAGE_URI .
          docker push $IMAGE_URI 
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

      # Setup kubectl 
      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      # Setup Helm
      - name: Setup Helm
        uses: azure/setup-helm@v4

      # update kubeconfig
      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region $AWS_REGION
            --name $AWS_CLUSTER_NAME

      # Deploy with Helm
      - name: Deploy with Helm 
        run: |
          helm upgrade --install web-dev ./web-stack \
            -f ./web-stack/values-dev.yaml \
            -n team-dev \
            --set web.image.tag=${IMAGE_TAG} \
            --create-namespace
